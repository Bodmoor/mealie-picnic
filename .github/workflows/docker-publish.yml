# Publishes ghcr.io/<owner>/mealie-picnic on every merge to main, and versioned
# tags for v*.*.* releases.
#
# There is deliberately NO test job here and NO `needs:` chain: main is a
# protected branch with the "CI" workflow as a required check, so every commit
# that can reach main has already passed build + tests on its PR. If that
# protection is ever loosened, this assumption breaks -- restore a test job here.
#
# Differences from the GitHub template this started as:
#   - no `pull_request` trigger (CI builds the image on PRs already)
#   - no daily cron (publishing untested-at-that-moment base image updates
#     nightly is not wanted for a payment-capable app; bump the base image
#     explicitly instead)
#   - secret scan on the build stage before anything is pushed
#   - explicit tag strategy: `latest` + `main` on merges, semver on tags
name: Publish

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false   # never abort a half-pushed release

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # sigstore/fulcio identity challenge for cosign

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Belt and braces: even though CI ran this on the PR, never push an image
      # containing a stray token. Cheap because of the shared build cache.
      - name: Assert no secrets in the build stage
        run: |
          docker build --target build -t mealie-picnic:build-stage .
          docker run --rm --entrypoint sh mealie-picnic:build-stage \
            -c 'found=$(find /src -name "picnic-token" -o -name "*.env" -o -name "secrets.json" | head -5); \
                if [ -n "$found" ]; then echo "SECRETS IN BUILD CONTEXT:"; echo "$found"; exit 1; fi; \
                echo "build context clean"'

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Signs the digest; writes to the public Rekor transparency log when the
      # package is public.
      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

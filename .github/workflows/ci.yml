# Validates every PR (and the merge commit on main). This is the required check
# for branch protection on main: publishing (docker-publish.yml) relies on it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore -warnaserror

      - name: Test
        run: dotnet test --no-build --logger "console;verbosity=normal"

      - name: Vulnerable packages
        # Was advisory "until the baseline is clean". It is clean -- two direct
        # dependencies, no advisories against either or their transitives -- so
        # this is a gate now: an advisory check nobody reads is the same as no
        # check, and this app is internet-facing.
        #
        # The command exits 0 even when it finds something, so the output is what
        # has to be inspected. Two ways that can go wrong, and both are guarded:
        #
        #   * without pipefail, the pipeline's status is `tee`'s -- always 0 --
        #     so a scan that failed outright would look like a pass
        #   * hunting only for the bad line means a scan that produced NO listing
        #     (an unreachable audit source, say) also looks like a pass, which is
        #     the same silence this step was promoted from advisory to fix
        #
        # So: fail on the bad line, and require the good one to actually be there.
        run: |
          set -o pipefail
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable packages found -- see the listing above."
            exit 1
          fi
          if ! grep -q "has no vulnerable packages given the current sources" vulnerable.txt; then
            echo "::error::The vulnerability scan produced no verdict -- treating that as a failure."
            exit 1
          fi

  # PR-only: proves the Dockerfile still builds and that no secret can reach a
  # layer. On main the publish workflow builds (and re-checks) the real image,
  # so building here again would be duplicate work.
  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@68827325e0b33c7199eb31dd4e31fbe9023e06e3 # v3.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Same platform list as the publish workflow, so an arm64-only breakage
      # (the deployment target) fails the PR rather than the release.
      - name: Build image (both architectures)
        run: docker buildx build --platform linux/amd64,linux/arm64 -t mealie-picnic:ci .

      - name: Assert no secrets in the build context
        run: |
          docker build --target build -t mealie-picnic:build-stage .
          docker run --rm --entrypoint sh mealie-picnic:build-stage \
            -c 'found=$(find /src -name "picnic-token" -o -name "*.env" -o -name "secrets.json" | head -5); \
                if [ -n "$found" ]; then echo "SECRETS IN BUILD CONTEXT:"; echo "$found"; exit 1; fi; \
                echo "build context clean"'

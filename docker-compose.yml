services:
  mealie-picnic:
    build: .
    image: mealie-picnic
    container_name: mealie-picnic
    restart: unless-stopped
    ports:
      # Loopback only by default: the app speaks plain HTTP and the session
      # cookie would otherwise cross the LAN in cleartext. To expose it, put a
      # TLS proxy in front and set COOKIE_SECURE=true, TRUST_PROXY=true.
      - "127.0.0.1:8080:8080"
    environment:
      # --- web UI login (required) ---
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}

      # --- OIDC login (optional): this app's own dedicated Authentik application ---
      BOODSCHAPPEN_OIDC_AUTHORITY: ${BOODSCHAPPEN_OIDC_AUTHORITY:-}
      BOODSCHAPPEN_OIDC_CLIENT_ID: ${BOODSCHAPPEN_OIDC_CLIENT_ID:-}
      BOODSCHAPPEN_OIDC_CLIENT_SECRET: ${BOODSCHAPPEN_OIDC_CLIENT_SECRET:-}

      # --- Mealie (required) ---
      MEALIE_URL: ${MEALIE_URL:?set MEALIE_URL in .env}
      MEALIE_TOKEN: ${MEALIE_TOKEN:?set MEALIE_TOKEN in .env}
      MEALIE_LIST: ${MEALIE_LIST:-Boodschappen}

      # --- Picnic (optional: the UI can ask for these at login) ---
      PICNIC_USER: ${PICNIC_USER:-}
      PICNIC_PASSWORD: ${PICNIC_PASSWORD:-}
      PICNIC_COUNTRY: ${PICNIC_COUNTRY:-NL}

      SEARCH_CACHE_MINUTES: ${SEARCH_CACHE_MINUTES:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      # Named volume, so it inherits the non-root ownership baked into the image.
      # A bind mount (./data:/data) also works, but the host directory must be
      # owned by UID 1654 or the container cannot write the token.
      - picnic-data:/data

volumes:
  picnic-data:

services:
  mealie-picnic:
    build: .
    image: mealie-picnic
    container_name: mealie-picnic
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # --- web UI login (required) ---
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}

      # --- Mealie (required) ---
      MEALIE_URL: ${MEALIE_URL:?set MEALIE_URL in .env}
      MEALIE_TOKEN: ${MEALIE_TOKEN:?set MEALIE_TOKEN in .env}
      MEALIE_LIST: ${MEALIE_LIST:-Boodschappen}

      # --- Picnic (optional: the UI can ask for these at login) ---
      PICNIC_USER: ${PICNIC_USER:-}
      PICNIC_PASSWORD: ${PICNIC_PASSWORD:-}
      PICNIC_COUNTRY: ${PICNIC_COUNTRY:-NL}

      SEARCH_CACHE_MINUTES: ${SEARCH_CACHE_MINUTES:-30}
    volumes:
      # Named volume, so it inherits the non-root ownership baked into the image.
      # A bind mount (./data:/data) also works, but the host directory must be
      # owned by UID 1654 or the container cannot write the token.
      - picnic-data:/data

volumes:
  picnic-data:
